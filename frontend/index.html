<!DOCTYPE html>
<html>
<head>
    <title>Smart Waste Dashboard</title>
    <style>
        body {
            background: #0f172a;
            color: white;
            font-family: Arial;
            text-align: center;
        }

        h1 {
            color: #22c55e;
        }

        .container {
            display: flex;
            justify-content: center;
            gap: 20px;
            margin-top: 50px;
        }

        .card {
            background: #1e293b;
            padding: 20px;
            border-radius: 15px;
            width: 200px;
        }

        .value {
            font-size: 22px;
            margin-top: 10px;
        }
    </style>
</head>

<body>

<h1>Smart Waste Classification Dashboard</h1>

<div class="container">

    <div class="card">
        <h3>Status</h3>
        <div class="value" id="status">Loading...</div>
    </div>

    <div class="card">
        <h3>Waste Type</h3>
        <div class="value" id="waste">Loading...</div>
    </div>

</div>

<script>

async function fetchData() {
    try {
        let res = await fetch("http://127.0.0.1:5000/data");
        let data = await res.json();

        document.getElementById("status").innerText = data.status;
        document.getElementById("waste").innerText = data.waste;

    } catch (e) {
        console.log("Error fetching data");
    }
}

setInterval(fetchData, 1000);

</script>

</body>
</html>
